<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Document{% endif %}</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 0.3em 0.6em; }
        th { background: #eee; }
        pre code.hljs { background: transparent; padding: 0; }
    </style>
    {% if has_code %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js" integrity="sha384-wjfDDhOPPdjtva8vWBhWeVprSpmxisEu5aYT3q1JyACqXpdKpo3PWZTMVq24MBix" crossorigin="anonymous"></script>
    <script>hljs.highlightAll();</script>
    {% endif %}
    {% if has_mermaid %}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2" crossorigin="anonymous"></script>
    <script>mermaid.initialize({ startOnLoad: true });</script>
    {% endif %}
</head>
<body>
    {% if title %}<h1>{{ title }}</h1>{% endif %}

    {% if toc_html %}
    <nav>
        {{ toc_html | safe }}
    </nav>
    {% endif %}

    <main>
        {% for path, body in sections %}
            {{ body | safe }}
            {% if not loop.last %}<hr>{% endif %}
        {% endfor %}
    </main>
</body>
</html>
