[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mddoco"
version = "2.0.3"
description = "Markdown to HTML/PDF document converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "markdown>=3.5",
    "jinja2>=3.1",
    "playwright>=1.40",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.16,<0.17",
]

[project.scripts]
mddoco = "mddoco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mddoco = ["themes/*.html"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
